[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fridom"
version = "0.0.5"
authors = [
  { name="Silvano Rosenau", email="silvano.rosenau@uni-hamburg.de" },
]
description = "Framework for Idealized Ocean Models"
readme = "README.md"
keywords = ["oceanography", "idealized ocean models", "modeling", "numerical modeling"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
  "lazypimp",
  "jax",
  "numpy",
  "scipy",
  "netCDF4",
  "zarr",
  "tqdm",
  "dill",
  "IPython",
  "coloredlogs",
  "regex",
  "pillow",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
dev = [
  "pylint",
  "pytest",
  "coverage",
  "ruff",
  "pre-commit",
  "xarray",
  "matplotlib",
  "imageio[ffmpeg]",
  "ipykernel",
]

[project.urls]
Repository = "https://github.com/Gordi42/FRIDOM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]

[tool.pylint]
extension-pkg-allow-list = ["mpi4py"]
good-names = [
  "ax",
  "z", "mz",
  "dx", "dy", "dz",
]

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
extend-select = [
  "D203",    # house style: blank line before class docstring
]
ignore = [
  # ---- docstring style (house style: NumPy convention + extras) ----
  "D105",    # no docstrings required for magic methods
  "D107",    # no docstrings required for __init__ (documented in class)
  "D211",    # house style: blank line before class docstring (see D203)
  "D212",    # house style: summary starts on the second line (D213)
  # ---- rules that fight the scientific-code house style ----
  "FBT001",  # boolean positional flags are idiomatic here
  "FBT002",  # boolean default positional arguments are idiomatic here
  "PLR0913", # model components legitimately take many arguments
  "TRY003",  # exception messages inline at raise site are fine
  "EM101",   # plain string messages in exceptions are fine
  "EM102",   # f-string messages in exceptions are fine
  # ---- annotation pragmatism ----
  "ANN401",  # `Any` is sometimes the honest type (backend arrays, kwargs)
  # ---- task-marker policy: TODO/FIXME with author tag, no issue links ----
  "TD001",   # FIXME(author) markers are part of the house style
  "TD003",   # no issue link required for TODOs
  "FIX001",  # FIXME markers are allowed in the codebase
  "FIX002",  # TODO markers are allowed in the codebase
  # ---- misc ----
  "COM812",  # conflicts with the ruff formatter / house comma style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D100",    # test modules need no module docstring
  "D101",    # test classes need no docstring
  "D102",    # test methods need no docstring
  "D103",    # test functions need no docstring
  "S101",    # pytest uses plain asserts
  "ANN",     # no type annotations required in tests
  "INP001",  # tests are not a package
  "SLF001",  # tests may access private members
  "N802",    # physics names like N2 in test function names
  "N803",    # physics names like N2 in test arguments
  "N806",    # physics names like N2 in test variables
  "PLR2004", # magic values in test assertions are fine
]
"__init__.py" = ["F401"]
"examples/**/*.py" = ["D205", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
