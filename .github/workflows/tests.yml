# This workflow will run the tests on every push and pull request to the repository.

name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]  # TODO: Add more versions

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run the tests (single device)
      run: |
        uv run pytest tests/ -n 4 --dist loadfile \
          --cov --cov-report=xml --cov-report=term \
          --junitxml=junit.xml -o junit_family=legacy

    - name: Run the tests (multiple devices)
      env:
        XLA_FLAGS: --xla_force_host_platform_device_count=4
        FRIDOM_TEST_FORCED_DEVICES: "4"
      run: |
        uv run pytest tests/framework/domain_decomposition/test_jax_decomposition.py -q

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage reports to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Smoke-run the benchmark suite (one repetition, smallest sizes) so
  # that the suite files cannot go stale. No timing assertions.
  benchmark-smoke:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Smoke-run the benchmark suite
      run: |
        uv run python -m fridom.benchmarking run benchmarks \
          --first-only --reps 1 --warmup 1
