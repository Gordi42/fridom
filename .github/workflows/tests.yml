# This workflow will run the tests on every push and pull request to the repository.

name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]  # TODO: Add more versions
        backends: ["numpy", "cupy", "jax_cpu", "jax_gpu"]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Fallback Python setup
      if: failure()  # Run this step if setup-python fails
      run: |
        mkdir -p $HOME/python-install
        cd /tmp
        wget https://www.python.org/ftp/python/3.11.x/Python-3.11.x.tar.xz
        tar -xf Python-3.11.x.tar.xz
        cd Python-3.11.x
        ./configure --prefix=$HOME/python-install
        make -j$(nproc)
        make install
        export PATH=$HOME/python-install/bin:$PATH
        python --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest coverage

    - name: Install the base package
      run: |
        pip install .

    - name: Install the backends
      run: |
        if [ ${{ matrix.backends }} == "jax_cpu" ]; then
          pip install jax
        elif [ ${{ matrix.backends }} == "jax_gpu" ]; then
          pip install jax[cuda12]
        elif [ ${{ matrix.backends }} == "cupy" ]; then
          pip install cupy-cuda12x
        fi

    - name: Run the tests
      run: |
        ./run_tests.sh -b ${{ matrix.backends }}
