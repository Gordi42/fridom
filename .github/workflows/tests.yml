# This workflow will run the tests on every push and pull request to the repository.

name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]  # TODO: Add more versions
        backends: ["numpy", "cupy", "jax_cpu", "jax_gpu"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Fallback Python setup
      run: |
        mamba create -n _fridom_tests python=${{ matrix.python-version }} -y
        conda activate _fridom_tests

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest coverage

    - name: Install the base package
      run: |
        pip install .

    - name: Install the backends
      run: |
        if [ ${{ matrix.backends }} == "jax_cpu" ]; then
          pip install jax
        elif [ ${{ matrix.backends }} == "jax_gpu" ]; then
          pip install jax[cuda12]
        elif [ ${{ matrix.backends }} == "cupy" ]; then
          pip install cupy-cuda12x
        fi

    - name: Run the tests
      run: |
        ./run_tests.sh -b ${{ matrix.backends }}
    
    - name: Cleanup
      run: |
        conda deactivate
        mamba env remove -n _fridom_tests -y --all
